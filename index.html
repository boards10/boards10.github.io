<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="YBEBrTvNDiFTqQj4zU8s5WXar4NPo7ZOGuMWQFIA6MQ" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 CBSE PYQ Archive</title>
<style>
  :root {
    --bg-color: #121212;
    --surface: #1e1e1e;
    --primary: #bb86fc;
    --text: #e0e0e0;
    --text-muted: #a0a0a0;
    --border: #333333;
    --hover: #2c2c2c;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text);
  }
  header {
    background-color: var(--surface);
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  .tabs {
    display: flex; overflow-x: auto;
    background-color: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1rem;
  }
  .tab {
    padding: 1rem 1.5rem; cursor: pointer; color: var(--text-muted);
    border-bottom: 3px solid transparent; transition: all 0.2s;
    white-space: nowrap; font-size: 0.9rem;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  main {
    padding: 1.5rem; max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem;
  }
  @media (max-width: 900px) {
    main { display: flex; flex-direction: column; }
    #viewer-col { height: 65vh; order: -1; }
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
  }
  .panel-header {
    background: #181818; padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 0.9rem;
  }
  .paper-list { overflow-y: auto; flex: 1; max-height: calc(100vh - 260px); }
  .paper-item {
    padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
    display: flex; flex-direction: column; gap: 0.3rem;
  }
  .paper-item:hover { background: var(--hover); }
  .paper-item.active {
    background: rgba(187,134,252,0.1); border-left: 3px solid var(--primary);
  }
  .paper-title { font-size: 0.95rem; font-weight: 500; }
  .paper-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .badge { padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; }
  .badge.board { background: #1e3a8a; color: #bfdbfe; }
  .badge.sample { background: #166534; color: #bbf7d0; }
  #viewer-col { height: calc(100vh - 170px); }
  #pdf-viewer { width: 100%; height: 100%; border: none; background: #2a2a2a; }
  .btn {
    background: var(--primary); color: #000; border: none;
    padding: 0.45rem 0.9rem; border-radius: 4px; font-weight: 600;
    cursor: pointer; text-decoration: none; font-size: 0.85rem;
    transition: opacity 0.2s; display: inline-block;
  }
  .btn:hover { opacity: 0.85; }
  .btn.outline {
    background: transparent; border: 1px solid var(--primary);
    color: var(--primary);
  }
  .btn.outline:hover { background: rgba(187,134,252,0.1); }
</style>
</head>
<body>

<header>
  <h1>CBSE Class 10 Previous Year Papers</h1>
  <a id="dl-all-btn" href="#" class="btn" download>Download All ZIPs &mdash; <span id="dl-name"></span></a>
</header>

<div class="tabs" id="subject-tabs"></div>

<main>
  <div class="panel" id="list-col">
    <div class="panel-header">
      <span id="list-count"></span>
    </div>
    <div class="paper-list" id="paper-list"></div>
  </div>
  <div class="panel" id="viewer-col">
    <div class="panel-header">
      <span id="viewer-title" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:1rem;">Select a paper to preview</span>
      <a id="dl-one-btn" class="btn outline" href="#" download style="display:none">Download PDF</a>
    </div>
    <iframe id="pdf-viewer" src="about:blank"></iframe>
  </div>
</main>

<script src="data.js"></script>
<script>
const SUBJ_INFO = {
  english: "English", math: "Mathematics", science: "Science",
  social: "Social Science", arabic: "Arabic", ait: "AI / IT"
};
let curSubj = "english";

function initTabs() {
  const tabs = document.getElementById("subject-tabs");
  tabs.innerHTML = "";
  Object.keys(SUBJ_INFO).forEach(key => {
    if (!DATA[key]) return;
    const t = document.createElement("div");
    t.className = "tab" + (key === curSubj ? " active" : "");
    t.textContent = SUBJ_INFO[key];
    t.onclick = () => {
      curSubj = key;
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      renderList();
    };
    tabs.appendChild(t);
  });
}

function renderList() {
  const pList = document.getElementById("paper-list");
  pList.innerHTML = "";
  const papers = DATA[curSubj] || [];
  document.getElementById("list-count").textContent = papers.length + " papers";
  document.getElementById("dl-name").textContent = SUBJ_INFO[curSubj];
  document.getElementById("dl-all-btn").href = "https://github.com/boards10/boards10.github.io/releases/download/v1.0.0/" + curSubj + ".zip";
  document.getElementById("viewer-title").textContent = "Select a paper to preview";
  document.getElementById("dl-one-btn").style.display = "none";
  document.getElementById("pdf-viewer").src = "about:blank";
  papers.forEach(p => {
    const el = document.createElement("div");
    el.className = "paper-item";
    const parts = [];
    if (p.year) parts.push(p.year);
    if (p.type === "Sample") parts.push("Sample Paper");
    else if (p.exam) parts.push(p.exam);
    if (p.set && p.set !== "null" && p.set !== "None") parts.push("Set " + p.set);
    const title = parts.join(" – ") || "Paper " + p.n;
    const kb = Math.round((p.size || 0) / 1024);
    const badge = p.type === "Board" ? "board" : "sample";
    el.innerHTML = `<div class="paper-title">${title}</div>
<div class="paper-meta"><span class="badge ${badge}">${p.type}</span><span>${p.source}</span><span>${kb} KB</span></div>`;
    el.onclick = () => {
      document.querySelectorAll(".paper-item").forEach(i => i.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("viewer-title").textContent = title;
      const btn = document.getElementById("dl-one-btn");
      btn.href = p.file; btn.style.display = "inline-block";
      document.getElementById("pdf-viewer").src = p.file;
    };
    pList.appendChild(el);
  });
  if (papers.length > 0) pList.firstChild.click();
}

window.onload = () => { initTabs(); renderList(); };
</script>
</body>
</html>
